<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCS 稼働と支払い</title>
<style>
  :root{
    --背景:#f5f6f8; --文字:#1a1a1a; --薄文字:#666; --線:#eceef1;
    --緑:#06c755; --濃緑:#06803a;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:system-ui,-apple-system,sans-serif;
       background:var(--背景);color:var(--文字)}
  h1{font-size:18px;margin:0 0 4px}
  .date{font-size:13px;color:var(--薄文字);margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:#fff;
       font-size:14px;font-weight:600;color:var(--薄文字);cursor:pointer;
       box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tab.on{background:var(--緑);color:#fff}
  .nav{display:flex;justify-content:space-between;align-items:center;
       font-size:13px;margin-bottom:12px}
  .nav button{border:0;background:none;color:var(--濃緑);font-size:13px;cursor:pointer;padding:4px}
  .nav span{font-weight:600}
  .total{background:#1a1a1a;color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .total .t{font-size:12px;opacity:.75}
  .total .v{font-size:28px;font-weight:700}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;
        box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .hub{font-size:16px;font-weight:600;margin-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .t2{font-size:11px;color:var(--薄文字)}
  .v2{font-size:20px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:6px 4px;border-top:1px solid var(--線);text-align:left}
  th{font-size:11px;color:var(--薄文字);font-weight:600}
  td.n,th.n{text-align:right}
  .sub{font-size:12px;color:var(--薄文字)}
  .foot{font-size:11px;color:#888;text-align:center;margin-top:18px}
  .err{background:#fdecec;color:#a33;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6}
  .yen{font-weight:700}
</style>
</head>
<body>

<h1 id="見出し">読み込んでいます…</h1>
<div class="date" id="副題"></div>
<div id="本体"></div>
<div class="foot">KCS配達管理</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// このページは LINE の中から開かれる前提。
// GASのウェブアプリの中ではLIFFが動かないので、画面だけをここに置き、
// 数字はGASから取る。誰が見ているかはLINEが出すIDトークンで決まるので、
// 自分の分しか表示されない。
var LIFF_ID = '2012068693-V4NDP7tp';
var GAS = 'https://script.google.com/macros/s/AKfycbwggf6vqnn8laEIWpH2cRRpySkK5uhSq8wWge4EPQq6pttAQua-iQFmG_N3tcysxN8S/exec';

var トークン = '';
var 種類 = 'today';
var 年月 = 今月();

function 今月(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function 月をずらす(ym, n){
  var d = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7)) - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function 和(ym){ return ym.slice(0,4) + '年' + Number(ym.slice(5,7)) + '月'; }
function 円(n){ return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function 逃がす(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function 出す(html){ document.getElementById('本体').innerHTML = html; }
function 困った(文){ 出す('<div class="err">' + 逃がす(文) + '</div>'); }

// GASへ問い合わせる。POSTが通らない環境のためGETの控えも用意する
function 取りに行く(){
  var url = GAS + '?api=' + 種類 + '&ym=' + 年月;
  // 今日の状況は金額を含まないので、本人確認なしで取れる
  if (種類 === 'today') return fetch(url).then(function(r){ return r.json(); });
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ id_token: トークン })
  }).then(function(r){ return r.json(); })
    .catch(function(){
      return fetch(url + '&id_token=' + encodeURIComponent(トークン))
        .then(function(r){ return r.json(); });
    });
}

function 見出しを描く(氏名, 副題){
  document.getElementById('見出し').textContent = 氏名;
  document.getElementById('副題').textContent = 副題 || '';
}

function タブ(id, 名){
  return '<div class="tab ' + (種類 === id ? 'on' : '') + '" onclick="切り替え(\'' + id + '\')">' + 名 + '</div>';
}

function 枠(月送りあり){
  var h = '<div class="tabs">'
    + タブ('today', '今日の状況')
    + タブ('driver', 'ドライバー')
    + タブ('hub', 'ハブ')
    + '</div>';
  if (月送りあり) {
    h += '<div class="nav">'
      + '<button onclick="月を動かす(-1)">&lsaquo; ' + 和(月をずらす(年月,-1)) + '</button>'
      + '<span>' + 和(年月) + '</span>'
      + '<button onclick="月を動かす(1)">' + 和(月をずらす(年月,1)) + ' &rsaquo;</button>'
      + '</div>';
  }
  return h;
}

function 今日を描く(d){
  var h = 枠(false);
  h += '<div class="total"><div class="t">全HUB合計</div><div class="v">' + d.合計 + ' 個</div></div>';
  d.HUB.forEach(function(x){
    h += '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
      + '<div class="hub">' + 逃がす(x.HUB名) + '</div>'
      + '<div style="font-size:22px;font-weight:700">' + x.全体数 + '</div></div>'
      + '<div class="sub">持ち出し ' + x.持ち出し + ' ／ 不在 ' + x.不在 + '</div>';
    if (x.今日休み) h += '<div class="err" style="padding:6px 10px;margin-top:6px;display:inline-block;font-size:12px">今日は休み</div>';
    if (x.明日休み) h += '<div class="err" style="padding:6px 10px;margin-top:6px;display:inline-block;font-size:12px;background:#fff5e0;color:#8a6100">明日は休み</div>';
    h += x.稼働中.length
      ? '<div class="sub" style="margin-top:6px;color:#06803a">' + x.稼働中.map(逃がす).join('、') + ' 稼働中</div>'
      : '<div class="sub" style="margin-top:6px">稼働中の人はいません</div>';
    h += '</div>';
  });
  出す(h);
}

function ドライバーを描く(d){
  var h = 枠(true);
  h += '<div class="total"><div class="t">今月の支払い</div><div class="v">' + 円(d.金額) + '</div></div>';
  h += '<div class="card"><div class="grid">'
    + '<div><div class="t2">稼働日数</div><div class="v2">' + d.稼働日数 + '</div></div>'
    + '<div><div class="t2">実配達</div><div class="v2">' + d.実配達 + '</div></div>'
    + '<div><div class="t2">HUB数</div><div class="v2">' + d.明細.length + '</div></div>'
    + '</div></div>';

  if (d.明細.length) {
    h += '<div class="card"><div class="hub">HUB別</div><table>'
      + '<tr><th>HUB</th><th class="n">持ち出し</th><th class="n">不在</th><th class="n">実配達</th><th class="n">単価</th><th class="n">金額</th></tr>';
    d.明細.forEach(function(x){
      h += '<tr><td>' + 逃がす(x.HUB名) + '</td>'
        + '<td class="n">' + x.持ち出し + '</td>'
        + '<td class="n">' + x.不在 + '</td>'
        + '<td class="n"><b>' + x.実配達 + '</b></td>'
        + '<td class="n">' + 円(x.単価) + '</td>'
        + '<td class="n yen">' + 円(x.金額) + '</td></tr>';
    });
    h += '</table></div>';
  }

  if (d.日別.length) {
    h += '<div class="card"><div class="hub">日別</div><table>'
      + '<tr><th>日</th><th>HUB</th><th class="n">持ち出し</th><th class="n">不在</th><th class="n">実配達</th></tr>';
    d.日別.forEach(function(x){
      h += '<tr><td>' + x.日付.slice(5).replace('-','/') + '</td>'
        + '<td>' + 逃がす(x.HUB名) + '</td>'
        + '<td class="n">' + x.持ち出し + '</td>'
        + '<td class="n">' + x.不在 + '</td>'
        + '<td class="n"><b>' + x.実配達 + '</b></td></tr>';
    });
    h += '</table></div>';
  } else {
    h += '<div class="card"><div class="sub">この月の報告はまだありません。</div></div>';
  }
  出す(h);
}

function ハブを描く(d){
  var h = 枠(true);
  h += '<div class="total"><div class="t">今月の支払い合計</div><div class="v">' + 円(d.支払い合計) + '</div></div>';

  if (!d.ハブ.length) {
    h += '<div class="card"><div class="sub">担当しているHUBがありません。</div></div>';
    出す(h); return;
  }

  d.ハブ.forEach(function(x){
    h += '<div class="card"><div class="hub">' + 逃がす(x.HUB名) + '</div>'
      + '<div class="grid">'
      + '<div><div class="t2">全体数</div><div class="v2">' + x.全体数 + '</div></div>'
      + '<div><div class="t2">人数</div><div class="v2">' + x.ドライバー.length + '</div></div>'
      + '<div><div class="t2">支払い</div><div class="v2">' + 円(x.支払い合計) + '</div></div>'
      + '</div>';

    if (x.ドライバー.length) {
      h += '<table><tr><th>ドライバー</th><th class="n">実配達</th><th class="n">単価</th><th class="n">金額</th></tr>';
      x.ドライバー.forEach(function(p){
        h += '<tr><td>' + 逃がす(p.氏名) + '</td>'
          + '<td class="n">' + p.実配達 + '</td>'
          + '<td class="n">' + 円(p.単価) + '</td>'
          + '<td class="n yen">' + 円(p.金額) + '</td></tr>';
      });
      h += '</table>';
    }

    if (x.日別.length) {
      h += '<table><tr><th>日</th><th class="n">全体数</th></tr>';
      x.日別.forEach(function(v){
        h += '<tr><td>' + v.日付.slice(5).replace('-','/') + '</td>'
          + '<td class="n">' + v.全体数 + '</td></tr>';
      });
      h += '</table>';
    }
    h += '</div>';
  });
  出す(h);
}

function 描き直す(){
  if ((種類 === 'driver' || 種類 === 'hub') && !トークン) {
    見出しを描く('稼働と支払い', '');
    出す(枠(false) + '<div class="err">本人の確認ができていないため、金額は表示できません。'
      + 'LINEのメニューから開き直してください。</div>');
    return;
  }
  出す('<div class="card"><div class="sub">読み込んでいます…</div></div>');
  取りに行く().then(function(r){
    if (!r || !r.ok) { 困った((r && r.理由) || '表示できませんでした。'); return; }
    if (種類 === 'today') {
      見出しを描く('今日の配達状況', r.データ.時刻 + ' 時点');
      今日を描く(r.データ);
    } else if (種類 === 'driver') {
      見出しを描く(r.氏名 + ' さんの稼働', '自分の分だけが表示されます');
      ドライバーを描く(r.データ);
    } else {
      見出しを描く(r.氏名 + ' さんのハブ', '自分の分だけが表示されます');
      ハブを描く(r.データ);
    }
  }).catch(function(){
    困った('データを取りに行けませんでした。通信を確認して、もう一度開いてください。');
  });
}

function 切り替え(x){ 種類 = x; 描き直す(); }
function 月を動かす(n){ 年月 = 月をずらす(年月, n); 描き直す(); }

// LINEにつながらなくても「今日の状況」は見られるようにする。
// 金額のタブだけが本人確認を必要とする。
liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login(); return; }
  トークン = liff.getIDToken() || '';
}).catch(function(){
  トークン = '';
}).then(function(){
  描き直す();
});
</script>
</body>
</html>
