<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUB 稼働状況</title>
<style>
  :root{
    --背景:#f5f6f8; --文字:#1a1a1a; --薄文字:#666; --線:#eceef1;
    --緑:#06c755; --濃緑:#06803a;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:system-ui,-apple-system,sans-serif;
       background:var(--背景);color:var(--文字)}
  h1{font-size:18px;margin:0 0 4px}
  .date{font-size:13px;color:var(--薄文字);margin-bottom:14px}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px 2px;border-radius:10px;background:#fff;
       font-size:13px;white-space:nowrap;font-weight:600;color:var(--薄文字);cursor:pointer;
       box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tab.on{background:var(--緑);color:#fff}
  .nav{display:flex;justify-content:space-between;align-items:center;
       font-size:13px;margin-bottom:12px}
  .nav button{border:0;background:none;color:var(--濃緑);font-size:13px;cursor:pointer;padding:4px}
  .nav span{font-weight:600}
  .total{background:#1a1a1a;color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .total .t{font-size:12px;opacity:.75}
  .total .v{font-size:28px;font-weight:700}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;
        box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .hub{font-size:16px;font-weight:600;margin-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .t2{font-size:11px;color:var(--薄文字)}
  .v2{font-size:20px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:6px 4px;border-top:1px solid var(--線);text-align:left}
  th{font-size:11px;color:var(--薄文字);font-weight:600}
  td.n,th.n{text-align:right}
  .sub{font-size:12px;color:var(--薄文字)}
  .foot{font-size:11px;color:#888;text-align:center;margin-top:18px}
  /* HUBは2列×3段で並べる */
  .hubgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .hubgrid .card{margin-bottom:0;padding:12px}
  .hubgrid .hub{font-size:14px}
  .big{font-size:26px;font-weight:700;line-height:1.15;margin-top:2px}
  /* 状態で色を分ける */
  .st-rest{background:#fdecec}
  .st-tomo{background:#fff5e0}
  .st-go{background:#e8f7ee}
  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;
       display:inline-block;margin-top:6px;line-height:1.5}
  .tag-rest{background:#a33;color:#fff}
  .tag-tomo{background:#8a6100;color:#fff}
  .tag-go{background:#06803a;color:#fff}
  .err{background:#fdecec;color:#a33;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6}
  .yen{font-weight:700}
</style>
</head>
<body>

<h1 id="見出し">読み込んでいます…</h1>
<div class="date" id="副題"></div>
<div id="本体"></div>
<div class="foot">KCS配達管理</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// このページは LINE の中から開かれる前提。
// GASのウェブアプリの中ではLIFFが動かないので、画面だけをここに置き、
// 数字はGASから取る。誰が見ているかはLINEが出すIDトークンで決まるので、
// 自分の分しか表示されない。
var LIFF_ID = '2012068693-V4NDP7tp';
var GAS = 'https://script.google.com/macros/s/AKfycbwggf6vqnn8laEIWpH2cRRpySkK5uhSq8wWge4EPQq6pttAQua-iQFmG_N3tcysxN8S/exec';

var トークン = '';
var 種類 = 'today';
var 年月 = 今月();

function 今月(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function 月をずらす(ym, n){
  var d = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7)) - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function 和(ym){ return ym.slice(0,4) + '年' + Number(ym.slice(5,7)) + '月'; }
function 円(n){ return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function 逃がす(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function 出す(html){ document.getElementById('本体').innerHTML = html; }
function 困った(文){ 出す('<div class="err">' + 逃がす(文) + '</div>'); }

// GASへ問い合わせる。POSTが通らない環境のためGETの控えも用意する
function 取りに行く(){
  var url = GAS + '?api=' + 種類 + '&ym=' + 年月;
  // 今日の状況は金額を含まないので、本人確認なしで取れる
  if (種類 === 'today') return fetch(url).then(function(r){ return r.json(); });
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ id_token: トークン })
  }).then(function(r){ return r.json(); })
    .catch(function(){
      return fetch(url + '&id_token=' + encodeURIComponent(トークン))
        .then(function(r){ return r.json(); });
    });
}

function 見出しを描く(氏名, 副題){
  document.getElementById('見出し').textContent = 氏名;
  document.getElementById('副題').textContent = 副題 || '';
}

function タブ(id, 名){
  return '<div class="tab ' + (種類 === id ? 'on' : '') + '" onclick="切り替え(\'' + id + '\')">' + 名 + '</div>';
}

function 枠(月送りあり){
  var h = '<div class="tabs">'
    + タブ('today', '今日の状況')
    + タブ('driver', 'ドライバー')
    + タブ('hub', 'ハブ')
    + タブ('help', '使い方')
    + '</div>';
  if (月送りあり) {
    h += '<div class="nav">'
      + '<button onclick="月を動かす(-1)">&lsaquo; ' + 和(月をずらす(年月,-1)) + '</button>'
      + '<span>' + 和(年月) + '</span>'
      + '<button onclick="月を動かす(1)">' + 和(月をずらす(年月,1)) + ' &rsaquo;</button>'
      + '</div>';
  }
  return h;
}

function 今日を描く(d){
  var h = 枠(false) + '<div class="hubgrid">';
  d.HUB.forEach(function(x){
    // 色の優先順位: 今日休み > 稼働中 > 明日休み > ふつう
    var 色 = x.今日休み ? ' st-rest'
           : (x.稼働中.length ? ' st-go'
           : (x.明日休み ? ' st-tomo' : ''));

    h += '<div class="card' + 色 + '">'
      + '<div class="hub">' + 逃がす(x.HUB名) + '</div>'
      + '<div class="big">' + x.全体数 + '</div>'
      + '<div class="sub">持ち出し ' + x.持ち出し + '／不在 ' + x.不在 + '</div>';

    if (x.今日休み) h += '<div class="tag tag-rest">今日は休み</div>';
    else if (x.明日休み) h += '<div class="tag tag-tomo">明日は休み</div>';

    if (x.稼働中.length) {
      x.稼働中.forEach(function(名){
        h += '<div class="tag tag-go">' + 逃がす(名) + '</div> ';
      });
    } else if (!x.今日休み) {
      h += '<div class="sub" style="margin-top:6px">稼働なし</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  出す(h);
}

function ドライバーを描く(d){
  var h = 枠(true);
  h += '<div class="total"><div class="t">今月の支払い</div><div class="v">' + 円(d.金額) + '</div></div>';
  h += '<div class="card"><div class="grid">'
    + '<div><div class="t2">稼働日数</div><div class="v2">' + d.稼働日数 + '</div></div>'
    + '<div><div class="t2">実配達</div><div class="v2">' + d.実配達 + '</div></div>'
    + '<div><div class="t2">HUB数</div><div class="v2">' + d.明細.length + '</div></div>'
    + '</div></div>';

  if (d.明細.length) {
    h += '<div class="card"><div class="hub">HUB別</div><table>'
      + '<tr><th>HUB</th><th class="n">持ち出し</th><th class="n">不在</th><th class="n">実配達</th><th class="n">単価</th><th class="n">金額</th></tr>';
    d.明細.forEach(function(x){
      h += '<tr><td>' + 逃がす(x.HUB名) + '</td>'
        + '<td class="n">' + x.持ち出し + '</td>'
        + '<td class="n">' + x.不在 + '</td>'
        + '<td class="n"><b>' + x.実配達 + '</b></td>'
        + '<td class="n">' + 円(x.単価) + '</td>'
        + '<td class="n yen">' + 円(x.金額) + '</td></tr>';
    });
    h += '</table></div>';
  }

  if (d.日別.length) {
    h += '<div class="card"><div class="hub">日別</div><table>'
      + '<tr><th>日</th><th>HUB</th><th class="n">持ち出し</th><th class="n">不在</th><th class="n">実配達</th></tr>';
    d.日別.forEach(function(x){
      h += '<tr><td>' + x.日付.slice(5).replace('-','/') + '</td>'
        + '<td>' + 逃がす(x.HUB名) + '</td>'
        + '<td class="n">' + x.持ち出し + '</td>'
        + '<td class="n">' + x.不在 + '</td>'
        + '<td class="n"><b>' + x.実配達 + '</b></td></tr>';
    });
    h += '</table></div>';
  } else {
    h += '<div class="card"><div class="sub">この月の報告はまだありません。</div></div>';
  }
  出す(h);
}

function ハブを描く(d){
  var h = 枠(true);
  if (d.オーナー報酬合計) {
    h += '<div class="total"><div class="t">今月の店舗の金額</div><div class="v">'
      + 円(d.オーナー報酬合計) + '</div></div>';
    h += '<div class="card"><div class="t2">ドライバーへの支払い合計</div>'
      + '<div class="v2">' + 円(d.支払い合計) + '</div></div>';
  } else {
    h += '<div class="total"><div class="t">今月の支払い合計</div><div class="v">' + 円(d.支払い合計) + '</div></div>';
  }

  if (!d.ハブ.length) {
    h += '<div class="card"><div class="sub">担当しているHUBがありません。</div></div>';
    出す(h); return;
  }

  d.ハブ.forEach(function(x){
    h += '<div class="card"><div class="hub">' + 逃がす(x.HUB名) + '</div>'
      + '<div class="grid">'
      + '<div><div class="t2">全体数</div><div class="v2">' + x.全体数 + '</div></div>'
      + '<div><div class="t2">配達完了</div><div class="v2">' + (x.配完合計 || 0) + '</div></div>'
      + '<div><div class="t2">払う ／ ドライバー</div><div class="v2">' + 円(x.支払い合計) + '</div></div>'
      + '</div>';

    // ―― もらう分 ――
    if (!x.管理外 && x.売上合計) {
      h += '<div class="card" style="margin:10px 0 0"><div class="t2">もらう ／ Amazonからの入金（今月）'
        + '（' + (x.配完合計 || 0) + '個 × ' + x.売上単価 + '円）</div>'
        + '<div class="v2">' + 円(x.売上合計) + '</div></div>';
    }
    if (x.請求) {
      h += '<div class="card" style="margin:10px 0 0"><div class="t2">もらう ／ '
        + 逃がす(x.請求.宛名) + ' さんへの請求</div>'
        + '<div class="v2">' + 円(x.請求.合計) + '</div>'
        + '<table><tr><th>走った人</th><th class="n">実配達</th><th class="n">単価</th><th class="n">金額</th></tr>';
      x.請求.明細.forEach(function(p){
        h += '<tr><td>' + 逃がす(p.氏名) + '</td>'
          + '<td class="n">' + p.実配達 + '</td>'
          + '<td class="n">' + 円(p.単価) + '</td>'
          + '<td class="n yen">' + 円(p.金額) + '</td></tr>';
      });
      h += '</table></div>';
    }

    // オーナーの取り分（要＝店舗の金額、谷田部＝12.5%の報酬）
    if (x.オーナー報酬) {
      h += '<div class="total" style="margin:10px 0 0">'
        + '<div class="t">' + 逃がす(x.報酬ラベル || 'オーナーの取り分')
        + '（' + (x.配完合計 || 0) + '個 × ' + x.報酬単価 + '円）</div>'
        + '<div class="v">' + 円(x.オーナー報酬) + '</div></div>';
    }

    // その拠点のオーナーへ払う分（KCSから支払う）
    if (x.オーナー先 && x.オーナー先.金額) {
      h += '<div class="card" style="margin:10px 0 0"><div class="t2">払う ／ '
        + 逃がす(x.オーナー先.氏名) + ' さんへ'
        + (x.オーナー先.種別 === 'オーナー報酬' ? 'のインセンティブ' : 'の店舗分')
        + '（' + (x.配完合計 || 0) + '個 × ' + x.オーナー先.単価 + '円）</div>'
        + '<div class="v2">' + 円(x.オーナー先.金額) + '</div></div>';
    }

    // 週ごと（日曜〜土曜）。1週間ずつ更新されていく
    if (x.週別 && x.週別.length) {
      h += '<div class="t2" style="margin:12px 0 4px">週ごと（日〜土）'
        + '<span class="sub"> ／ 1個 ' + (x.売上単価 || 0) + '円</span></div>'
        + '<table><tr><th>期間</th><th class="n">個数</th><th class="n">金額</th></tr>';
      x.週別.forEach(function(w, i){
        h += '<tr><td>' + 逃がす(w.期間) + (i === 0 ? ' <span class="sub">今週</span>' : '') + '</td>'
          + '<td class="n">' + w.実配達 + '</td>'
          + '<td class="n yen">' + 円(w.金額) + '</td></tr>';
      });
      h += '</table>';
    }

    if (x.ドライバー.length) {
      h += '<table><tr><th>ドライバー</th><th class="n">実配達</th><th class="n">単価</th><th class="n">金額</th></tr>';
      x.ドライバー.forEach(function(p){
        h += '<tr><td>' + 逃がす(p.氏名) + '</td>'
          + '<td class="n">' + p.実配達 + '</td>'
          + '<td class="n">' + 円(p.単価) + '</td>'
          + '<td class="n yen">' + 円(p.金額) + '</td></tr>';
      });
      h += '</table>';
    }

    if (x.日別.length) {
      h += '<table><tr><th>日</th><th class="n">全体数</th></tr>';
      x.日別.forEach(function(v){
        h += '<tr><td>' + v.日付.slice(5).replace('-','/') + '</td>'
          + '<td class="n">' + v.全体数 + '</td></tr>';
      });
      h += '</table>';
    }
    h += '</div>';
  });
  出す(h);
}

function 本人確認へ(){
  try { liff.login(); } catch (e) {
    困った('LINEの確認画面を開けませんでした。LINEのメニューから開き直してください。');
  }
}

// 使い方。本人確認も通信もいらないので、その場で描く
var 使い方の中身 = [
  ['出発するとき', [
    ['メニューの「出発・帰庫」を押す', '出発か帰庫かを聞かれます'],
    ['「出発」を押す', 'どこの拠点か、番号で聞かれます'],
    ['拠点の番号を送る', 'その拠点で稼働開始になります'],
    ['別の拠点にも行く', 'もう一度「出発」を押してください。1日に何回でも押せます'],
    ['いま動いている拠点', '出発するたびに「いまうごいている拠点」が返ってきます']
  ]],
  ['帰るとき', [
    ['「帰庫」を押す', '稼働中の拠点が1つならそのまま記録されます'],
    ['2拠点以上まわっていた', 'どこの帰庫か聞かれるので、拠点を選んでください'],
    ['帰庫したあと', '不在の報告をそのまま貼り付ければ、数字を読み取ります'],
    ['まだ別の拠点が残っている', '「まだ ○○ が稼働中です」と出ます']
  ]],
  ['個数を間違えたとき', [
    ['「修正」と送る', 'きのう・きょうの自分の報告が番号つきで出ます'],
    ['番号を送る', 'いまの個数が表示されます'],
    ['正しい個数を数字だけで送る', '上書きされます。元の数は記録に残ります']
  ]],
  ['そのほか', [
    ['「休み連絡」', 'いつ休みかを聞かれます'],
    ['「振り分け」', '要の荷物をだれが何個やるかを出します'],
    ['画面（スクショ）を送る', '稼働中の拠点が自動で選ばれます']
  ]]
];

var よくある質問 = [
  ['全体の個数に前日の不在は入っていますか？',
   '入っています。朝の全体数 ＝ その日の入庫数 ＋ 前日の不在。あとから足さないでください。'],
  ['不在は配達完了に入りますか？',
   '入りません。依頼と追加は配達完了に入ります。'],
  ['週ごとの表はいつ変わりますか？',
   '日曜はじまり・土曜おわりです。日曜になると1週ぶん繰り上がって、4週分が見られます。'],
  ['金額が自分に見えないのはなぜ？',
   '金額は本人にだけ表示します。「LINEで確認する」を押して本人確認してください。'],
  ['数字がシートと合わないときは？',
   'シートの数字が正です。入れ直せば画面にも反映されます。']
];

function 使い方を描く(){
  var h = 枠(false);
  使い方の中身.forEach(function(組){
    h += '<div class="card"><div class="hub">' + 逃がす(組[0]) + '</div>'
      + '<table>';
    組[1].forEach(function(行){
      h += '<tr><td><b>' + 逃がす(行[0]) + '</b></td><td>' + 逃がす(行[1]) + '</td></tr>';
    });
    h += '</table></div>';
  });
  h += '<div class="card"><div class="hub">よくある質問</div>';
  よくある質問.forEach(function(q){
    h += '<div style="margin:0 0 10px">'
      + '<div style="font-weight:600">Q. ' + 逃がす(q[0]) + '</div>'
      + '<div class="sub">A. ' + 逃がす(q[1]) + '</div></div>';
  });
  h += '</div>';
  出す(h);
}

function 描き直す(){
  if (種類 === 'help') {
    見出しを描く('使い方', 'LINEでこう送ると、こうなります');
    使い方を描く();
    return;
  }
  if ((種類 === 'driver' || 種類 === 'hub') && !トークン) {
    見出しを描く('HUB 稼働状況', '');
    出す(枠(false)
      + '<div class="card"><div class="sub" style="margin-bottom:10px">'
      + '金額は本人にだけ表示します。LINEで本人の確認をしてください。</div>'
      + '<div class="tab on" style="cursor:pointer" onclick="本人確認へ()">LINEで確認する</div>'
      + '</div>');
    return;
  }
  出す('<div class="card"><div class="sub">読み込んでいます…</div></div>');
  取りに行く().then(function(r){
    if (!r || !r.ok) { 困った((r && r.理由) || '表示できませんでした。'); return; }
    if (種類 === 'today') {
      見出しを描く('今日の配達状況', r.データ.時刻 + ' 時点');
      今日を描く(r.データ);
    } else if (種類 === 'driver') {
      見出しを描く(r.氏名 + ' さんの稼働', '自分の分だけが表示されます');
      ドライバーを描く(r.データ);
    } else {
      見出しを描く(r.氏名 + ' さんのハブ', '自分の分だけが表示されます');
      ハブを描く(r.データ);
    }
  }).catch(function(){
    困った('データを取りに行けませんでした。通信を確認して、もう一度開いてください。');
  });
}

function 切り替え(x){ 種類 = x; 描き直す(); }
function 月を動かす(n){ 年月 = 月をずらす(年月, n); 描き直す(); }

// LINEにつながらなくても「今日の状況」は見られるようにする。
// ここで強制的にログインへ飛ばすと普通のブラウザで開けなくなるので、
// 金額のタブを押したときだけ本人確認する。
liff.init({ liffId: LIFF_ID }).then(function(){
  if (liff.isLoggedIn()) トークン = liff.getIDToken() || '';
}).catch(function(){
  トークン = '';
}).then(function(){
  描き直す();
});
</script>
</body>
</html>
