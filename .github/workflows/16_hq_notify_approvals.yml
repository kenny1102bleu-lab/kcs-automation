name: WF-16 中枢アプリの承認待ちを Discord へ

# 新しい承認待ち（Firestore の approvals）を、担当マネージャーのチャンネルへ送る。30分ごと。
# 対応表（knowledge/discord）がまだ無ければ何もしない（先に WF-17 でチャンネルを作る）。
# このリポジトリは公開。ログに出すのは件数だけ（題名・取引先名・金額は出さない）。
# 鍵は新しく増やさない: FIREBASE_SERVICE_ACCOUNT_JSON と、既存の BOT_WEBHOOK_URL。

on:
  schedule:
    - cron: '7,37 * * * *'  # 毎時 7分と37分（正時のアクセス集中を避ける）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true なら送らず、件数だけ確かめる'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: hq-notify-approvals
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests firebase-admin
      - name: 新しい承認待ちを送る
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/hq_notify_approvals.py --dry-run
          else
            python scripts/hq_notify_approvals.py
          fi
