name: WF-13 スタッフ経営会議

on:
  schedule:
    - cron: '0 1 * * 1'  # JST 毎週月曜 10:00（リョウの週次提案 9:00 の後）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staff_roundtable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/staff_roundtable.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
          HAL_TWITTER_API_KEY: ${{ secrets.HAL_TWITTER_API_KEY }}
          HAL_TWITTER_API_SECRET: ${{ secrets.HAL_TWITTER_API_SECRET }}
          HAL_TWITTER_ACCESS_TOKEN: ${{ secrets.HAL_TWITTER_ACCESS_TOKEN }}
          HAL_TWITTER_ACCESS_SECRET: ${{ secrets.HAL_TWITTER_ACCESS_SECRET }}
          SUNAKUN_TWITTER_API_KEY: ${{ secrets.SUNAKUN_TWITTER_API_KEY }}
          SUNAKUN_TWITTER_API_SECRET: ${{ secrets.SUNAKUN_TWITTER_API_SECRET }}
          SUNAKUN_TWITTER_ACCESS_TOKEN: ${{ secrets.SUNAKUN_TWITTER_ACCESS_TOKEN }}
          SUNAKUN_TWITTER_ACCESS_SECRET: ${{ secrets.SUNAKUN_TWITTER_ACCESS_SECRET }}
      - name: Commit roundtable rationale doc
        if: always()
        run: |
          if [ -n "$(git status --porcelain docs/rationale/ 2>/dev/null)" ]; then
            git config user.email "noa-bot@kcs.local"
            git config user.name "Noa Bot"
            git add docs/rationale/
            git commit -m "docs: スタッフ経営会議 議事録"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
