name: WF-15 秘書室 朝の報告

# 2026-11-17 新設（kcs-hq の decisions.md に記録）。毎朝 JST 8:00。
# AIは使わない。失敗の取りこぼしと、昨日の決定事項の追記だけを並べる。
# 承認待ち・事業の数字は Firestore 接続後に足す。

on:
  schedule:
    - cron: '0 23 * * *'  # JST 8:00（UTC 前日23:00）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 なら Discord に送らず、ログだけ出す'
        default: '0'

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kcs-hq が非公開で読めない場合は、この段だけ失敗を許す（報告には「読めませんでした」と出る）。
      # 読めるようにするには、Secrets に HQ_READ_TOKEN（kcs-hq を読める権限だけ）を置く。値は謙一だけが貼る。
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kenny1102bleu-lab/kcs-hq
          path: hq
          token: ${{ secrets.HQ_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/secretary_morning.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
          DRY_RUN: ${{ inputs.dry_run }}
